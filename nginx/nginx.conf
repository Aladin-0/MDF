worker_processes auto;            # one worker per CPU core (the default was a single worker)

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # ── Who is the visitor? ───────────────────────────────────────────────
    # Every request reaches us through the public nginx (saudapakka_nginx), which arrives from the Docker network's
    # gateway, so $remote_addr was the same address (172.19.0.1) for every customer: the whole pharmacy shared ONE rate
    # limit (5 logins a minute, 50 API calls a second), the /admin/ allow-list could not work and the audit trail
    # recorded that address for everybody. The public nginx sends the real address in X-Real-IP; trust it only when the
    # request comes from inside Docker's private ranges (a visitor from the internet cannot set it for us).
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   X-Real-IP;

    limit_req_zone $binary_remote_addr zone=api:10m   rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # keep connections to the app servers open instead of opening one per request
    upstream backend  { server backend:8000;  keepalive 16; }
    upstream frontend { server frontend:3000; keepalive 16; }

    # WebSocket upgrades still work; ordinary requests keep the upstream connection alive
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Next.js build files (/_next/static/...) have the content hash in their name and never change, so nginx keeps a copy
    # instead of asking Node for them on every page load.
    proxy_cache_path /var/cache/nginx/next_static levels=1:2 keys_zone=next_static:10m max_size=300m inactive=7d use_temp_path=off;

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;              # Level 6 = best speed/size ratio (default is 1)
    gzip_min_length 1024;           # Don't compress tiny responses < 1KB
    gzip_proxied any;               # Compress proxied responses too
    gzip_vary on;                   # Add Vary: Accept-Encoding for CDN compatibility
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    server {
        listen 80;
        server_name _;
        client_max_body_size 50M;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # Django admin: open to the internet but only a SUPER ADMIN can sign in (mediflow/urls.py). The old IP allow-list
        # (182.70.63.4) was not the shop's address. The sign-in page is rate limited like the app's login, so passwords
        # cannot be guessed quickly.
        location = /admin/login/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /admin/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/auth/login/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            # big report answers stay in memory instead of being spooled to disk
            proxy_buffers 16 64k;
            proxy_buffer_size 64k;
        }

        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host       $host;
            proxy_cache next_static;
            proxy_cache_valid 200 7d;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
            expires 365d;
            access_log off;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 60s;
        }
    }
}
