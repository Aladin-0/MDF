components:
  schemas:
    ActivityEventLegacyAdapter:
      type: object
      description: |-
        Adapter that serializes ActivityEvent into the EXACT shape expected by the frontend
        for the legacy ActivityLog model.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        user:
          type: string
          readOnly: true
        user_email:
          type: string
          readOnly: true
        outlet:
          type: string
          readOnly: true
        outlet_name:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 255
        module:
          type: string
          maxLength: 255
        entity_type:
          type: string
          maxLength: 255
        entity_id:
          type: string
          maxLength: 255
        entity_label:
          type: string
          maxLength: 255
        description:
          type: string
          default: ''
        changes_json: {}
        metadata_json:
          type: string
          readOnly: true
        endpoint:
          type: string
          default: ''
        http_method:
          type: string
          default: ''
        status_code:
          type: integer
          default: 200
        ip_address:
          type: string
          nullable: true
        ip_is_routable:
          type: boolean
          default: true
        user_agent:
          type: string
        request_id:
          type: string
          nullable: true
          maxLength: 255
      required:
      - action
      - id
      - metadata_json
      - module
      - outlet
      - outlet_name
      - timestamp
      - user
      - user_email
    DraftInvoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/DraftInvoiceItem'
        hospital_name:
          type: string
          nullable: true
        customer:
          type: string
          format: uuid
          nullable: true
        doctor:
          type: string
          format: uuid
          nullable: true
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        extra_discount_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          default: '0.00'
        round_off:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        prescription_no:
          type: string
          nullable: true
          maxLength: 100
        draft_status:
          $ref: '#/components/schemas/DraftStatusEnum'
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        taxable_amount:
          type: string
          format: decimal
