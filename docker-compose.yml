services:
  postgres:
    image: postgres:17-alpine
    container_name: mediflow_postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - internal
  redis:
    image: redis:7-alpine
    container_name: mediflow_redis
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
    volumes:
    - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - internal
  backend:
    build:
      context: ./apps/backend
      dockerfile: ../../docker/backend.Dockerfile
    container_name: mediflow_backend
    restart: unless-stopped
    command:
    - sh
    - -c
    - python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000
    ports:
    - "8000:8000"
    volumes:
    - ./apps/backend:/app
    - static_files:/app/staticfiles
    - media_files:/app/media
    env_file:
    - ./apps/backend/.env
    environment:
      TZ: Asia/Kolkata
      DJANGO_SETTINGS_MODULE: mediflow.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - internal
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: mediflow_frontend
    restart: unless-stopped
    command:
    - npm
    - run
    - dev
    ports:
    - "3000:3000"
    env_file:
    - ./apps/frontend/.env.local
    environment:
      TZ: Asia/Kolkata
      NODE_ENV: development
    volumes:
    - ./apps/frontend:/app/apps/frontend
    - ./packages:/app/packages
    - ./node_modules:/app/node_modules
    depends_on:
    - backend
    networks:
    - internal
  celery:
    build:
      context: ./apps/backend
      dockerfile: ../../docker/backend.Dockerfile
    container_name: mediflow_celery
    restart: unless-stopped
    command:
    - celery
    - -A
    - mediflow
    - worker
    - --loglevel=info
    - --concurrency=2
    volumes:
    - ./apps/backend:/app
    - media_files:/app/media
    env_file:
    - ./apps/backend/.env
    environment:
      TZ: Asia/Kolkata
      DJANGO_SETTINGS_MODULE: mediflow.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - internal
  nginx:
    image: nginx:stable-alpine
    container_name: mediflow_nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
    ports:
    - "8090:80"
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - static_files:/app/staticfiles:ro
    - media_files:/app/media:ro
    depends_on:
    - backend
    - frontend
    networks:
    - internal
volumes:
  postgres_data:
    external: true
    name: mediflow_main_postgres_data
  redis_data:
    external: true
    name: mediflow_main_redis_data
  static_files: null
  media_files: null
networks:
  internal:
    driver: bridge
