<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Invoice - S.P.S Manavata Pharma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            font-size: 14px; 
            --primary-color: #0f766e; /* Teal 700 */
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 20px 0;
            transition: all 0.3s ease;
        }

        .ui-controls {
            margin: 0 auto 16px auto;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            transition: max-width 0.3s ease;
        }
        .ui-btn {
            font-size: 14px !important;
            padding: 8px 16px !important;
            border-radius: 6px !important;
            font-weight: 600 !important;
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            cursor: pointer !important;
            transition: all 0.2s !important;
            border: 1px solid transparent !important;
        }
        .ui-btn-outline {
            background-color: #f3f4f6 !important;
            color: #374151 !important;
            border-color: #d1d5db !important;
        }
        .ui-btn-outline:hover { background-color: #e5e7eb !important; }
        .ui-btn-primary {
            background-color: var(--primary-color) !important;
            color: white !important;
        }
        .ui-btn-primary:hover { background-color: #115e59 !important; }
        .ui-btn-active {
            background-color: #1f2937 !important;
            color: white !important;
            border-color: #1f2937 !important;
        }

        #print-container {
            margin: 0 auto;
            display: flex;
            /* Will be set dynamically by JS to stack or go side-by-side */
            align-items: center; 
        }

        .invoice-wrapper {
            background-color: white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex; 
            flex-direction: column;
        }

        /* Border & Table Utilities */
        .pdf-table th, .pdf-table td {
            border: 1px solid #d1d5db;
        }
        .border-heavy { border-width: 2px; border-color: #1f2937; }
        .border-b-heavy { border-bottom-width: 2px; border-color: #1f2937; }
        .border-t-heavy { border-top-width: 2px; border-color: #1f2937; }
        .border-r-heavy { border-right-width: 2px; border-color: #1f2937; }
        .border-l-heavy { border-left-width: 2px; border-color: #1f2937; }

        @media print {
            body { background-color: white; padding: 0; }
            .ui-controls { display: none !important; }
            
            #print-container {
                gap: 0 !important; 
                display: flex !important;
            }

            .invoice-wrapper {
                box-shadow: none !important;
                margin: 0 !important;
                page-break-inside: avoid;
                /* Remove any dynamic scaling margin for print */
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
    
    <!-- Dynamic Print Page Style -->
    <style id="print-page-style">
        @page { size: A4 portrait; margin: 0; }
    </style>
</head>
<body>

    <div class="ui-controls" id="controls-container" style="max-width: 297mm;">
        <!-- INVOICE TYPE TOGGLE -->
        <div style="display: flex; gap: 8px; margin-right: 24px; border-right: 2px solid #d1d5db; padding-right: 24px;">
            <button id="btn-retail" onclick="setType('retail')" class="ui-btn ui-btn-active">
                <svg style="width:16px; height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Retail
            </button>
            <button id="btn-wholesale" onclick="setType('wholesale')" class="ui-btn ui-btn-outline">

                Wholesale
            </button>
        </div>
        <div style="flex-grow: 1; display: flex; gap: 8px;">
            <button id="btn-a4" onclick="setFormat('A4')" class="ui-btn ui-btn-outline" title="Prints on Full A4 Paper (Landscape)">
                <svg style="width:16px; height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                A4 (Wide Landscape)
            </button>
            <button id="btn-a5" onclick="setFormat('A5')" class="ui-btn ui-btn-active" title="Stacks 2 copies vertically on A4 Portrait (Cut in half)">
                <svg style="width:16px; height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                A5 (Standard Half-Page)
            </button>
        </div>
        <button onclick="window.print()" class="ui-btn ui-btn-primary">
            <svg style="width:16px; height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
            Print
        </button>
    </div>

    <div id="print-container">
        <!-- Invoice 1 (Original) -->
        <div class="invoice-wrapper" id="invoice-1" style="width: 210mm; min-height: 148.5mm;">
        </div>

        <!-- Invoice 2 (Duplicate - Only used in A5 to fill bottom half of paper) -->
        <div class="invoice-wrapper" id="invoice-2" style="width: 210mm; min-height: 148.5mm; border-top: 1px dashed #9ca3af;">
        </div>
    </div>

                                <!-- 18% Card -->

    <script>
        let currentType = 'retail';
        let currentFormat = 'A5';

        document.addEventListener('DOMContentLoaded', () => {
            setType('retail');
            setFormat('A5');
        });

        function setType(type) {
            currentType = type;
            
            // Update UI Buttons
            document.getElementById('btn-retail').className = type === 'retail' ? 'ui-btn ui-btn-active' : 'ui-btn ui-btn-outline';
            document.getElementById('btn-wholesale').className = type === 'wholesale' ? 'ui-btn ui-btn-active' : 'ui-btn ui-btn-outline';
            
            // Load correct template
            const templateId = type === 'retail' ? 'invoice-template' : 'wholesale-template';
            const template = document.getElementById(templateId).innerHTML;
            
            document.getElementById('invoice-1').innerHTML = template;
            document.getElementById('invoice-2').innerHTML = template;
        }

        /**
         * Switches the layout to horizontal models.
         * A4 = Full Width Landscape (Massive columns)
         * A5 = Half Page Landscape (Standard Pharmacy Size, prints 2 vertically on A4 Portrait)
         */
        function setFormat(format) {
            const root = document.documentElement;
            const invoice1 = document.getElementById('invoice-1');
            const invoice2 = document.getElementById('invoice-2');
            const printContainer = document.getElementById('print-container');
            const controlsContainer = document.getElementById('controls-container');
            const pageStyle = document.getElementById('print-page-style');
            
            const btnA4 = document.getElementById('btn-a4');
            const btnA5 = document.getElementById('btn-a5');

            btnA4.className = 'ui-btn ui-btn-outline';
            btnA5.className = 'ui-btn ui-btn-outline';

            if (format === 'A4') {
                // A4 Landscape Layout (297mm Wide x 210mm High)
                root.style.fontSize = '18px'; // Scale fonts up for massive page
                
                invoice1.style.width = '297mm';
                invoice1.style.minHeight = '210mm';
                
                // Hide duplicate, only need 1 for A4 landscape
                invoice2.style.display = 'none';
                
                controlsContainer.style.maxWidth = '297mm';
                printContainer.style.flexDirection = 'row';
                printContainer.style.gap = '20px'; // For screen viewing
                
                // Tell printer to use A4 Landscape
                pageStyle.innerHTML = '@page { size: A4 landscape; margin: 0; }';
                btnA4.className = 'ui-btn ui-btn-active';
                
            } else {
                // A5 Landscape Layout (210mm Wide x 148.5mm High)
                // This is the standard width of an A4 paper (210mm).
                root.style.fontSize = '14px'; // Standard font size
                
                const a5Width = '210mm';
                const a5Height = '148.5mm';
                
                invoice1.style.width = a5Width;
                invoice1.style.minHeight = a5Height;
                
                invoice2.style.display = 'flex';
                invoice2.style.width = a5Width;
                invoice2.style.minHeight = a5Height;
                
                controlsContainer.style.maxWidth = '210mm';
                printContainer.style.flexDirection = 'column'; // Stack vertically!
                printContainer.style.gap = '20px'; // Gap for screen, removed in print
                
                // Tell printer to use A4 Portrait. 
                // Since 2 copies of 148.5mm = 297mm, they perfectly fill the A4 height!
                pageStyle.innerHTML = '@page { size: A4 portrait; margin: 0; }';
                btnA5.className = 'ui-btn ui-btn-active';
            }
        }
    </script>
</body>
</html>
